name: Update Stats & 3D Contribution

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  STATS_INSTANCE: https://github-readme-stats-indol-xi-49.vercel.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Stats Card (self-hosted instance)
        run: |
          mkdir -p profile
          curl -fsSL --retry 3 --retry-delay 5 \
            "$STATS_INSTANCE/api?username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=tokyonight&hide_title=true&bg_color=00000000&title_color=00D2FF&icon_color=00D2FF&text_color=8B949E" \
            -o profile/stats.svg \
          || echo '<!-- Something went wrong: fetch failed -->' > profile/stats.svg

      - name: Generate Top Languages Card (self-hosted instance)
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            "$STATS_INSTANCE/api/top-langs?username=${{ github.repository_owner }}&layout=compact&hide_border=true&theme=tokyonight&langs_count=6&hide_title=true&bg_color=00000000&title_color=00D2FF&text_color=8B949E" \
            -o profile/top-langs.svg \
          || echo '<!-- Something went wrong: fetch failed -->' > profile/top-langs.svg

      - name: Reject error cards (keep last good version)
        run: |
          if grep -q "Something went wrong" profile/stats.svg profile/top-langs.svg 2>/dev/null; then
            echo "::warning::Error card detected - restoring last committed version"
            git checkout HEAD -- profile/stats.svg profile/top-langs.svg || true
          fi

      # --- 3D Contribution ---
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: 3d-contrib-settings.json

      # --- Commit ---
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/ profile-3d-contrib/
          git diff --staged --quiet || git commit -m "chore: update stats & 3d contrib"
          git pull --rebase
          git push
